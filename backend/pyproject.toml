[project]
name = "clause-backend"
version = "1.0.0"
description = "Clause API: grounded answers from your documents (FastAPI, LangChain, FAISS)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    # Intel Macs on macOS 13/14 only have wheels up to faiss-cpu 1.13.x and onnxruntime 1.23.x
    "faiss-cpu>=1.15.1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "faiss-cpu>=1.12.0,<1.14 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.18 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.18,<1.24 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "fastapi[standard]>=0.162.0",
    "flashrank>=0.2.10",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "langchain-google-genai>=4.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.uv]
# Resolve versions that have ready-made wheels on every common machine, including Intel Macs.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
